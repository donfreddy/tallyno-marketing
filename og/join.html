<!doctype html>
<!--
	Source of public/og-join.jpg, the WhatsApp preview of invite links
	(tallyno.com/join/<token>). Regenerate with: pnpm og
-->
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
	@font-face {
		font-family: "Space Grotesk";
		src: url("../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2") format("woff2");
		font-weight: 300 700;
	}
	@font-face {
		font-family: "DM Sans";
		src: url("../node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2") format("woff2");
		font-weight: 100 1000;
	}
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 1200px; height: 630px; overflow: hidden; }
	body {
		position: relative;
		font-family: "DM Sans", sans-serif;
		color: #fff;
		background:
			radial-gradient(circle at 78% 45%, #00555c 0%, transparent 55%),
			linear-gradient(120deg, #001d20 0%, #003237 60%, #034349 100%);
	}
	.text { position: absolute; left: 80px; top: 128px; width: 560px; }
	.logo { display: flex; align-items: center; gap: 18px; font-family: "Space Grotesk"; font-weight: 700; font-size: 30px; letter-spacing: -0.02em; }
	.logo svg { width: 58px; height: 58px; }
	h1 { margin-top: 70px; font-family: "Space Grotesk"; font-weight: 700; font-size: 70px; line-height: 1.02; letter-spacing: -0.03em; }
	p { margin-top: 28px; font-size: 27px; line-height: 1.35; color: #b2e6ec; }
	.ring { position: absolute; left: 690px; top: 85px; width: 460px; height: 460px; }
</style>
</head>
<body>
	<div class="text">
		<div class="logo">
			<svg viewBox="0 0 1024 1024" aria-hidden="true">
				<rect width="1024" height="1024" rx="230" fill="#016770" />
				<path fill="#fff" d="M261 197H535A28 28 0 0 1 563 225V826H470A45 45 0 0 1 425 781V306H288A27 27 0 0 1 261 279Z" />
				<path fill="#fff" d="M599 197H735A27 27 0 0 1 762 224V306H599Z" />
			</svg>
			Tallyno
		</div>
		<h1>On t'invite dans un groupe.</h1>
		<p>Tontine ou dépenses partagées : ouvre le lien pour prendre ta place.</p>
	</div>

	<svg class="ring" viewBox="-10 -10 460 460" aria-hidden="true">
		<circle cx="220" cy="220" r="190" fill="none" stroke="#b2e6ec" stroke-opacity="0.18" stroke-width="2" />
		<circle cx="220" cy="220" r="92" fill="#003237" stroke="#b2e6ec" stroke-opacity="0.2" stroke-width="2" />
		<text x="220" y="212" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="40" fill="#fff">Ta place</text>
		<text x="220" y="248" text-anchor="middle" font-family="DM Sans" font-size="22" fill="#b2e6ec">t'attend</text>
		<g font-family="Space Grotesk" font-weight="700" font-size="26" text-anchor="middle">
			<!-- Six members around the ring, one free place: yours. -->
			<g><circle cx="220" cy="30" r="30" fill="#034349" stroke="#34d399" stroke-width="5" /><text x="220" y="39" fill="#fff">A</text></g>
			<g><circle cx="384.5" cy="125" r="30" fill="#034349" stroke="#34d399" stroke-width="5" /><text x="384.5" y="134" fill="#fff">M</text></g>
			<g><circle cx="384.5" cy="315" r="30" fill="#034349" stroke="#34d399" stroke-width="5" /><text x="384.5" y="324" fill="#fff">J</text></g>
			<g><circle cx="220" cy="410" r="30" fill="#034349" stroke="#34d399" stroke-width="5" /><text x="220" y="419" fill="#fff">E</text></g>
			<g><circle cx="55.5" cy="315" r="30" fill="#034349" stroke="#34d399" stroke-width="5" /><text x="55.5" y="324" fill="#fff">R</text></g>
			<g><circle cx="55.5" cy="125" r="36" fill="#fff" /><text x="55.5" y="134" fill="#00555c" font-size="24">Toi</text>
				<circle cx="55.5" cy="125" r="46" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="7 7" /></g>
		</g>
	</svg>
</body>
</html>
